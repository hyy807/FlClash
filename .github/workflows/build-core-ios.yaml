name: build-core-ios

# 阶段2-a: 把 FlClash 的 mihomo core 绑定成 iOS XCFramework
# （iOS 的 TUN 跑在 NetworkExtension 里，需要 gobind 的静态库 + Swift 桥）
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bind:
    name: gomobile bind (ios/arm64)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: core/go.sum

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          gomobile version || true

      - name: Bind core for iOS
        run: |
          set -x
          export PATH="$PATH:$(go env GOPATH)/bin"
          mkdir -p out
          cd core
          gomobile bind -v -target=ios -iosversion=15.0 -o "$GITHUB_WORKSPACE/out/FlClashCore.xcframework" . 2>&1 | tail -100
          ls -lh "$GITHUB_WORKSPACE/out"

      - name: Inspect framework
        if: always()
        run: |
          ls -R out | head -40
          find out -name "*.a" -o -name "Headers" -o -name "Modules" | head -10

      - name: Upload xcframework
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FlClashCore-ios
          path: out/FlClashCore.xcframework
          if-no-files-found: error
          retention-days: 14
