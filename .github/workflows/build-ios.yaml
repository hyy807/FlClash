name: build-ios

# FlClash iOS 移植构建（未签名 ipa，自签用）
# 阶段 1：打通 Flutter iOS 编译链（Dart + Rust native assets），产出可安装 ipa 骨架。
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'iOS bundle identifier'
        type: string
        default: 'com.flclash.client'

permissions:
  contents: read

jobs:
  ios:
    name: iOS arm64 (unsigned)
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      FLUTTER_VERSION: '3.47.6'
      BUNDLE_ID: ${{ inputs.bundle_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Rust iOS targets
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim || true
          rustc --version

      - name: Generate iOS runner
        run: |
          flutter create --platforms=ios --org com.flclash --project-name fl_clash .
          ls ios

      - name: Disable desktop Go core hook for iOS
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          p = Path('pubspec.yaml')
          s = p.read_text()
          s = s.replace("    setup:\n      build_assets: true", "    setup:\n      build_assets: false")
          p.write_text(s)
          print(s[:260])
          EOF

      - name: Flutter dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        id: build
        run: |
          set +e
          flutter build ios --release --no-codesign -v > "$RUNNER_TEMP/ios-build.log" 2>&1
          code=$?
          echo "exit=$code"
          grep -E "Error|error:|Failed|failed|The following|Could not|Unable" "$RUNNER_TEMP/ios-build.log" | tail -60 || true
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Package IPA if built
        if: ${{ steps.build.outputs.code == '0' }}
        env:
          BUNDLE_ID: ${{ env.BUNDLE_ID }}
        run: |
          set -eu
          app="build/ios/iphoneos/Runner.app"
          test -d "$app" || { echo "no Runner.app"; exit 1; }
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$app/Info.plist"
          for f in "$app"/PlugIns/*.appex; do
            [ -e "$f" ] || continue
            base="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$f/Info.plist")"
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${BUNDLE_ID}.$(basename "$f" .appex)" "$f/Info.plist"
          done
          mkdir -p "$RUNNER_TEMP/ipa/Payload" output
          ditto "$app" "$RUNNER_TEMP/ipa/Payload/Runner.app"
          find "$RUNNER_TEMP/ipa/Payload" -name "_CodeSignature" -prune -exec rm -rf {} + || true
          find "$RUNNER_TEMP/ipa/Payload" -name "embedded.mobileprovision" -delete || true
          (cd "$RUNNER_TEMP/ipa" && zip -qr "$GITHUB_WORKSPACE/output/FlClash-iOS-unsigned.ipa" Payload)
          ls -lh output/
          shasum -a 256 output/FlClash-iOS-unsigned.ipa

      - name: Upload artifact
        if: ${{ steps.build.outputs.code == '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-iOS-unsigned
          path: output/FlClash-iOS-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ${{ runner.temp }}/ios-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail if build failed
        if: ${{ steps.build.outputs.code != '0' }}
        run: exit 1
