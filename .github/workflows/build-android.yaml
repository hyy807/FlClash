name: build-android

on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.9.2-lx'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.3'

jobs:
  android:
    name: Android release APKs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install bindgen host libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-18-dev

      - name: Fetch CA certificates
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" https://curl.se/ca/cacert-2026-09-25.pem
          echo "a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505  $bundle" | sha256sum -c -

      - name: Install the NDK the build declares
        run: |
          # gradle/libs.versions.toml pins 28.2.13676358; without it AGP silently
          # falls back to the runner's NDK 27, which ships no libclang for bindgen.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" >/dev/null
          NDK_PATH="$ANDROID_HOME/ndk/28.2.13676358"
          {
            echo "ANDROID_NDK_HOME=$NDK_PATH"
            echo "ANDROID_NDK_ROOT=$NDK_PATH"
            echo "ANDROID_NDK=$NDK_PATH"
            echo "ANDROID_NDK_LATEST_HOME=$NDK_PATH"
            inc="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"
            for d in "$NDK_PATH"/toolchains/llvm/prebuilt/linux-x86_64/lib/clang/*/include; do
              [ -d "$d" ] && inc="$inc:$d"
            done
            echo "LIBCLANG_PATH=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/lib"
            echo "CPATH=$inc"
            echo "C_INCLUDE_PATH=$inc"
          } >> "$GITHUB_ENV"

      - name: Patch NDK sysroot for bindgen
        run: |
          # rquickjs-sys runs bindgen with the host libclang, which does not ship
          # the NDK's builtin headers; without them <stdbool.h>/<stdint.h> are
          # missing and every Android ABI fails to build.
          for ndk in "$ANDROID_HOME"/ndk/*; do
            llvm="$ndk/toolchains/llvm/prebuilt/linux-x86_64"
            [ -d "$llvm/sysroot/usr/include" ] || continue
            for f in "$llvm"/lib/clang/*/include/*; do
              [ -f "$f" ] || continue
              b=$(basename "$f")
              [ -e "$llvm/sysroot/usr/include/$b" ] || cp "$f" "$llvm/sysroot/usr/include/$b"
            done
            echo "patched $ndk"
          done

      - name: Flutter dependencies
        run: flutter pub get

      - name: Build Android release APKs
        env:
          FLCLASH_SKIP_RUST_ASSETS: '1'
        run: |
          set -euo pipefail
          # flutter_distributor always builds armv7, where bindgen on this runner
          # image cannot resolve the NDK stdint types. arm64 + x86_64 cover every
          # device we ship; the armv7 APK is produced locally and published with
          # the release.
          printf '{"APP_ENV":"stable"}' > env.json
          flutter build apk --release --split-per-abi \
            --target-platform android-arm64,android-arm,android-x64 \
            --dart-define-from-file=env.json
          mkdir -p dist
          cp build/app/outputs/flutter-apk/*-release.apk dist/
          find dist -maxdepth 1 -type f -print

      - name: Verify stable package metadata
        run: |
          set -euo pipefail
          python3 -c 'import json; assert json.load(open("env.json"))["APP_ENV"] == "stable"'
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          for apk in dist/*.apk; do
            "$aapt" dump badging "$apk" | grep "package:.*name='com.follow.clash'.*versionName='0.9.2'"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-LX-android
          path: ./dist/*.apk
          if-no-files-found: error
